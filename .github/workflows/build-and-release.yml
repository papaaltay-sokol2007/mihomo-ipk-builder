name: Build Mihomo IPK

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Ветка papaaltay-sokol2007/mihomo (branch to build)"
        required: true
        default: "Alpha"
      upx:
        description: "Сжимать бинарники UPX (compress with UPX)"
        type: boolean
        default: true
      version_suffix:
        description: "Суффикс версии, напр. -fix-pppoe (version suffix)"
        required: false
        default: ""
      go_version:
        description: "Версия Go (Go version)"
        required: false
        default: "1.24.x"

permissions:
  contents: write

jobs:
  build:
    name: Build and release IPK packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout builder repo
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go_version || '1.24.x' }}

      - name: Run build script
        run: |
          chmod +x build_mihomo_ipk.sh
          ./build_mihomo_ipk.sh \
            "${{ inputs.branch }}" \
            "${{ inputs.upx }}" \
            "${{ inputs.version_suffix }}"

      - name: Read build info
        id: info
        run: |
          if [ -f "$HOME/mihomo-ipk/BUILD_INFO" ]; then
            cat "$HOME/mihomo-ipk/BUILD_INFO"
          else
            echo "BUILD_INFO not found"; exit 1
          fi

      - name: Upload IPK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mihomo-ipk-${{ inputs.branch }}
          path: ${{ runner.home }}/mihomo-ipk/*.ipk
          if-no-files-found: error

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          . "$HOME/mihomo-ipk/BUILD_INFO"
          TAG="mihomo-${MIHOMO_BRANCH}-${MIHOMO_VERSION}"
          TITLE="Mihomo IPK ${MIHOMO_DISPLAY_VERSION} (${MIHOMO_BRANCH})"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skipping creation."
          else
            gh release create "$TAG" \
              "$HOME"/mihomo-ipk/*.ipk \
              --repo "${{ github.repository }}" \
              --title "$TITLE" \
              --notes "Built from: ${MIHOMO_SOURCE}
Branch: ${MIHOMO_BRANCH}
Version: ${MIHOMO_DISPLAY_VERSION}
Commit: ${MIHOMO_COMMIT}

Архитектуры / Architectures: aarch64-3.10, mipsel-3.4 (Entware / Keenetic)"
            echo "Release created: $TAG"
          fi
