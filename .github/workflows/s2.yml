name: S2
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Upload IPK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mihomo-ipk-${{ inputs.branch }}
          path: ${{ runner.home }}/mihomo-ipk/*.ipk
          if-no-files-found: error
