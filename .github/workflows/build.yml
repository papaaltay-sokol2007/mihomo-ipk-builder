name: Build Mihomo IPK

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch of papaaltay-sokol2007/mihomo"
        required: true
        default: "Alpha"
      upx:
        description: "Compress binaries with UPX"
        type: boolean
        default: true
      version_suffix:
        description: "Version suffix, e.g. -fix-pppoe"
        required: false
        default: ""
      go_version:
        description: "Go version"
        required: false
        default: "1.24.x"

permissions:
  contents: write

jobs:
  build:
    name: Build and release IPK packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go_version || '1.24.x' }}

      - name: Run build script
        run: bash build_mihomo_ipk.sh "${{ inputs.branch }}" "${{ inputs.upx }}" "${{ inputs.version_suffix }}"

      - name: Copy IPKs to workspace
        run: |
          mkdir -p mihomo-ipk
          cp "$HOME"/mihomo-ipk/*.ipk mihomo-ipk/

      - name: Upload IPK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mihomo-ipk-${{ inputs.branch }}
          path: mihomo-ipk/*.ipk
          if-no-files-found: error

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/release.sh
