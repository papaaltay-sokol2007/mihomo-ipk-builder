name: P2A
on:
  workflow_dispatch:
jobs:
  build:
    name: Build and release IPK packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout builder repo
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go_version || '1.24.x' }}
      - name: Run build script
        run: |
          chmod +x build_mihomo_ipk.sh
          ./build_mihomo_ipk.sh \
            "${{ inputs.branch }}" \
            "${{ inputs.upx }}" \
            "${{ inputs.version_suffix }}"
